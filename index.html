<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peak Draft</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #020617; color: #f1f5f9; min-height: 100vh; display: flex; justify-content: center; }
    .app { width: 100%; max-width: 420px; min-height: 100vh; background: #0f172a; padding: 16px; display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(0,0,0,0.6); }
    .hidden { display: none !important; }
    .screen { display: flex; flex-direction: column; gap: 14px; flex: 1; }
    h1 { font-size: 24px; font-weight: 800; color: #a78bfa; text-align: center; }
    .sub { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 2px; }
    .box { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 12px; }
    .row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    input[type="range"] { width: 100%; accent-color: #8b5cf6; cursor: pointer; }
    input[type="text"], input[type="number"], #names-box input { width: 100%; padding: 8px 10px; border-radius: 10px; background: #0f172a; border: 1px solid #475569; color: #fff; font-size: 13px; font-weight: 600; }
    button { cursor: pointer; border: none; border-radius: 12px; padding: 10px; font-weight: 700; color: #f8fafc; background: #334155; transition: 0.15s; }
    button:active { transform: scale(0.98); }
    .cat-active { background: rgba(139, 92, 246, 0.25); border: 2px solid #8b5cf6; }
    .cat-idle { background: #1e293b; border: 2px solid #334155; }
    .btn-main { width: 100%; padding: 14px; background: linear-gradient(90deg, #7c3aed, #c026d3); font-size: 15px; margin-top: 6px; }
    .btn-buy { background: #7c3aed; font-size: 12px; }
    .btn-dis { background: #0f172a; color: #64748b; border: 1px solid #1e293b; cursor: not-allowed; font-size: 12px; }
    .btn-ghost { width: 100%; background: transparent; border: 1px solid #475569; color: #cbd5e1; font-size: 12px; }
    .btn-gold { width: 100%; padding: 14px; background: #f59e0b; color: #0f172a; font-weight: 800; font-size: 15px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; overflow: hidden; }
    .card-top { position: relative; height: 190px; background: #020617; }
    .card-top img { width: 100%; height: 100%; object-fit: cover; }
    .badge-l { position: absolute; top: 8px; left: 8px; background: rgba(15,23,42,0.9); color: #c4b5fd; padding: 3px 10px; border-radius: 99px; font-size: 11px; font-weight: 700; }
    .badge-r { position: absolute; top: 8px; right: 8px; background: rgba(245,158,11,0.25); color: #fcd34d; border: 1px solid rgba(245,158,11,0.5); padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; }
    .p-chip { background: #1e293b; border: 1px solid #334155; text-align: left; font-size: 12px; padding: 8px 10px; }
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; padding: 16px; }
  </style>
</head>
<body>

  <div class="app">

    <!-- ЭКРАН 1: НАСТРОЙКИ -->
    <div id="screen-setup" class="screen">
      <div>
        <h1>⚡ PEAK DRAFT</h1>
        <p class="sub">Аукцион пиковых форм на одном экране</p>
      </div>

      <div>
        <div style="font-size:11px; color:#94a3b8; font-weight:700; margin-bottom:6px;">1. КАТЕГОРИЯ</div>
        <div class="grid2">
          <button id="cat-anime" onclick="setCat('anime')" class="cat-active">⚔️ Аниме</button>
          <button id="cat-bball" onclick="setCat('bball')" class="cat-idle">🏀 Баскетбол</button>
        </div>
      </div>

      <div class="box">
        <div class="row"><span>👥 Игроки</span><span id="lbl-players" style="color:#a78bfa;">3</span></div>
        <input id="inp-players" type="range" min="2" max="5" value="3" oninput="onPlayersChange(this.value)">
        <div id="names-box" class="grid2" style="margin-top:8px;"></div>
      </div>

      <div class="box">
        <div class="row"><span>🛡️ Героев в команде</span><span id="lbl-team" style="color:#a78bfa;">3</span></div>
        <input id="inp-team" type="range" min="1" max="10" value="3" oninput="document.getElementById('lbl-team').textContent = this.value">
      </div>

      <div class="box">
        <div class="row"><span>💰 Стартовый банк</span><span id="lbl-budget" style="color:#34d399;">100 $</span></div>
        <input id="inp-budget" type="range" min="1" max="500" value="100" oninput="document.getElementById('lbl-budget').textContent = this.value + ' $'">
      </div>

      <button onclick="startGame()" class="btn-main">🚀 Начать аукцион</button>
    </div>

    <!-- ЭКРАН 2: АУКЦИОН -->
    <div id="screen-auction" class="screen hidden" style="justify-content:space-between;">
      <div>
        <div class="row" style="font-size:11px; color:#94a3b8; font-weight:500;">
          <span>Нажми на игрока для просмотра состава</span>
          <span id="lot-num" style="color:#a78bfa; font-weight:700;">Лот #1</span>
        </div>
        <div id="players-bar" class="grid2"></div>
      </div>

      <div class="card">
        <div class="card-top">
          <img id="card-img" src="" alt="">
          <span id="card-title" class="badge-l"></span>
          <span class="badge-r">ПИК</span>
        </div>
        <div style="padding:12px;">
          <h2 id="card-name" style="font-size:18px; margin-bottom:4px;"></h2>
          <p id="card-desc" style="font-size:12px; color:#cbd5e1; line-height:1.45;"></p>
        </div>
      </div>

      <div class="box" style="display:flex; flex-direction:column; gap:8px;">
        <div style="display:flex; gap:6px;">
          <input id="bid-val" type="number" min="0" value="10" oninput="renderBuyBtns()">
          <button onclick="addBid(1)">+1$</button>
          <button onclick="addBid(10)">+10$</button>
          <button onclick="addBid(50)">+50$</button>
          <button onclick="setZero()">0</button>
        </div>
        <div id="buy-btns" class="grid2"></div>
        <button onclick="skipLot()" class="btn-ghost">⏭️ Пропустить лот</button>
      </div>
    </div>

    <!-- ЭКРАН 3: ФИНАЛ -->
    <div id="screen-final" class="screen hidden">
      <h2 style="text-align:center; color:#fbbf24; font-size:20px;">🏆 Команды собраны!</h2>
      <div id="final-teams" style="display:flex; flex-direction:column; gap:8px;"></div>
      <button id="btn-judge" onclick="askJudge()" class="btn-gold">⚖️ Узнать вердикт Судьи</button>
      <div id="judge-box" class="box hidden" style="border-color:#f59e0b; font-size:13px; line-height:1.5; white-space:pre-line;"></div>
      <button onclick="location.reload()" class="btn-ghost" style="margin-top:auto;">🔄 Новая игра</button>
    </div>

  </div>

  <!-- Модальное окно состава -->
  <div id="modal" onclick="this.classList.add('hidden')" class="modal-bg hidden">
    <div onclick="event.stopPropagation()" class="box" style="width:100%; max-width:320px;">
      <h3 id="modal-title" style="color:#c4b5fd; font-size:15px; margin-bottom:8px;"></h3>
      <div id="modal-list" style="display:flex; flex-direction:column; gap:6px; font-size:12px;"></div>
    </div>
  </div>


  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const MOCK = {
      anime: [
        { name: "Анос Волдигод", title: "Владыка демонов", img: "https://placehold.co", desc: "Пиковая форма: меч Венизднова разрушает концепции и законы логики, мгновенное воскрешение из собственного Истока." },
        { name: "Римуру Темпест", title: "О моём перерождении в слизь", img: "https://placehold.co", desc: "Истинный Дракон + Сиэль: поглощение любых атак Вельзевулом, управление пространством и временем." },
        { name: "Рёмен Сукуна", title: "Магическая битва", img: "https://placehold.co", desc: "Истинная форма + Махорага: Мировой Разрез, рассекающий само пространство, и открытая территория Гробница Зла." },
        { name: "Фанни Валентайн", title: "JoJo's Bizarre Adventure", img: "https://placehold.co", desc: "D4C Love Train: перенаправляет любой направленный в него урон и беду в случайную точку мира." },
        { name: "Итачи Учиха", title: "Наруто", img: "https://placehold.co", desc: "Эдо Тенсей: бесконечная чакра и регенерация, Цукуёми, Аматерасу, Зеркало Ята и запечатывающий Меч Тоцука." },
        { name: "Зараки Кенпачи", title: "Блич", img: "https://placehold.co", desc: "Пиковый Банкай: чудовищная мощь берсерка, разрубающая метеориты и само пространство одним взмахом." }
      ],
      bball: [
        { name: "Шакил О'Нил", title: "NBA • Центровой", img: "https://placehold.co", desc: "Пик мощи в краске: неудержимый продавливающий данк, тотальный контроль подборов и защита кольца." },
        { name: "Стефен Карри", title: "NBA • Разыгрывающий", img: "https://placehold.co", desc: "Лучший снайпер в истории: бросок с 10 метров без подготовки и постоянное растягивание всей защиты соперника." },
        { name: "Майкл Джордан", title: "NBA • Защитник", img: "https://placehold.co", desc: "Эталон атаки и персональной защиты: неостановимый средний с отклонением и хладнокровие в концовках." },
        { name: "Леброн Джеймс", title: "NBA • Форвард", img: "https://placehold.co", desc: "Универсальный лидер: видение площадки распасовщика, таранный проход и защита против всех позиций." },
        { name: "Никола Йокич", title: "NBA • Центровой", img: "https://placehold.co", desc: "Гениальный плеймейкер на позиции центрового: скрытые передачи, трехочковый и чтение игры." },
        { name: "Деннис Родман", title: "NBA • Тяжелый форвард", img: "https://placehold.co", desc: "Король подборов и персональной опеки: выключает лидеров соперника и забирает каждый ничейный мяч." }
      ]
    };

    let cat = 'anime';
    let players = [];
    let teamSize = 3;
    let pool = [];
    let lotIdx = 0;

    function setCat(c) {
      cat = c;
      document.getElementById('cat-anime').className = c === 'anime' ? 'cat-active' : 'cat-idle';
      document.getElementById('cat-bball').className = c === 'bball' ? 'cat-active' : 'cat-idle';
    }

    function onPlayersChange(val) {
      document.getElementById('lbl-players').textContent = val;
      const box = document.getElementById('names-box');
      const old = Array.from(box.querySelectorAll('input')).map(function(i) { return i.value; });
      box.innerHTML = '';
      for (let i = 0; i < parseInt(val); i++) {
        const inp = document.createElement('input');
        inp.value = old[i] || ('Игрок ' + (i + 1));
        inp.className = 'px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-xs';
        box.appendChild(inp);
      }
    }

    function startGame() {
      teamSize = parseInt(document.getElementById('inp-team').value);
      const budget = parseInt(document.getElementById('inp-budget').value);
      const inputs = document.getElementById('names-box').querySelectorAll('input');

      players = Array.from(inputs).map(function(inp, idx) {
        return {
          id: idx,
          name: inp.value.trim() || ('Игрок ' + (idx + 1)),
          money: budget,
          team: []
        };
      });

      pool = MOCK[cat].slice().sort(function() { return Math.random() - 0.5; });
      lotIdx = 0;

      document.getElementById('screen-setup').classList.add('hidden');
      document.getElementById('screen-auction').classList.remove('hidden');
      document.getElementById('screen-auction').classList.add('flex');
      renderAuction();
    }

    function renderAuction() {
      if (players.every(function(p) { return p.team.length >= teamSize; })) {
        showFinal();
        return;
      }
      if (lotIdx >= pool.length) lotIdx = 0;

      const item = pool[lotIdx];
      document.getElementById('lot-num').textContent = 'Лот #' + (lotIdx + 1);
      document.getElementById('card-img').src = item.img;
      document.getElementById('card-title').textContent = item.title;
      document.getElementById('card-name').textContent = item.name;
      document.getElementById('card-desc').textContent = item.desc;

      const bar = document.getElementById('players-bar');
      bar.innerHTML = '';
      players.forEach(function(p) {
        const btn = document.createElement('button');
        btn.onclick = function() { showModal(p); };
        btn.className = 'p-2 rounded-xl bg-slate-800 border border-slate-700 text-left text-xs';
        btn.innerHTML = '<div class="flex justify-between font-bold"><span>' + p.name + '</span><span class="text-emerald-400">' + p.money + '$</span></div>' +
                        '<div class="text-[10px] text-slate-400">Слоты: ' + p.team.length + '/' + teamSize + '</div>';
        bar.appendChild(btn);
      });

      renderBuyBtns();
    }

    function addBid(n) {
      const el = document.getElementById('bid-val');
      el.value = Math.max(0, (parseInt(el.value) || 0) + n);
      renderBuyBtns();
    }

    function setZero() {
      document.getElementById('bid-val').value = 0;
      renderBuyBtns();
    }

    function renderBuyBtns() {
      const bid = parseInt(document.getElementById('bid-val').value);
      const box = document.getElementById('buy-btns');
      box.innerHTML = '';

      players.forEach(function(p) {
        const full = p.team.length >= teamSize;
        const poor = isNaN(bid) || bid < 0 || bid > p.money;
        const dis = full || poor;

        const btn = document.createElement('button');
        btn.disabled = dis;
        btn.onclick = function() { buyLot(p.id, bid); };
        btn.className = dis ? 'btn-dis' : 'btn-buy';
        btn.textContent = full ? (p.name + ' (Полон)') : (poor ? (p.name + ' (Мало $)') : ('Отдать: ' + p.name + ' (' + bid + '$)'));
        box.appendChild(btn);
      });
    }

    function buyLot(pid, bid) {
      const p = players.find(function(x) { return x.id === pid; });
      p.money -= bid;
      const bought = Object.assign({}, pool[lotIdx], { paid: bid });
      p.team.push(bought);
      pool.splice(lotIdx, 1);
      renderAuction();
    }

    function skipLot() {
      lotIdx++;
      renderAuction();
    }

    function showModal(p) {
      document.getElementById('modal-title').textContent = p.name + ' (Остаток: ' + p.money + '$)';
      const list = document.getElementById('modal-list');
      list.innerHTML = p.team.length === 0
        ? '<div class="text-slate-400">Пока пусто</div>'
        : p.team.map(function(c) {
            return '<div class="p-2 rounded bg-slate-900 flex justify-between"><span>' + c.name + '</span><span class="text-emerald-400">' + c.paid + '$</span></div>';
          }).join('');
      document.getElementById('modal').classList.remove('hidden');
    }

    function showFinal() {
      document.getElementById('screen-auction').classList.add('hidden');
      document.getElementById('screen-final').classList.remove('hidden');
      document.getElementById('screen-final').classList.add('flex');

      document.getElementById('final-teams').innerHTML = players.map(function(p) {
        const roster = p.team.map(function(t) { return t.name + ' (' + t.paid + '$)'; }).join(', ');
        return '<div class="p-3 rounded-xl bg-slate-800 border border-slate-700">' +
                 '<div class="flex justify-between text-xs font-bold text-violet-300 mb-1">' +
                   '<span>' + p.name + '</span><span>Остаток: ' + p.money + '$</span>' +
                 '</div>' +
                 '<div class="text-xs text-slate-200">' + roster + '</div>' +
               '</div>';
      }).join('');
    }

    function askJudge() {
      document.getElementById('btn-judge').classList.add('hidden');
      const box = document.getElementById('judge-box');
      box.classList.remove('hidden');
      box.textContent = 'Демо-режим (без сервера):\n\nИнтерфейс полностью готов! На следующем шаге подключим Python-сервер с реальными картинками и судейством Gemini.';
    }

    onPlayersChange(3);
  </script>
</body>
</html>
